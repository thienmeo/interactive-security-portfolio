<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Cyber Security Shield Background -->
  <polygon points="50,6 88,22 88,60 50,94 12,60 12,22" fill="#07090e" stroke="url(#cyanGreenGrad)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Circuit Grid Lines -->
  <path d="M50 6 V94 M12 22 L88 60 M12 60 L88 22" stroke="rgba(0, 240, 255, 0.18)" stroke-width="1.5"/>

  <!-- Monogram T T Cyber Nodes -->
  <!-- Top T Bar -->
  <path d="M26 34 H74" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Central T Stem -->
  <path d="M50 34 V72" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Second T Branch / Cross Shield -->
  <path d="M34 50 H66" stroke="#00ffa3" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Glowing Central Core Node -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="50" cy="34" r="3" fill="#00f0ff"/>
  <circle cx="50" cy="72" r="3" fill="#00ffa3"/>

  <!-- Definitions for Gradients and Glow -->
  <defs>
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
